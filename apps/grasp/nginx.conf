server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Path-prefix deployments (e.g. an Apache reverse proxy serving the app at
    # /test/v2/) MUST strip the prefix before proxying, so nginx always sees
    # root-relative paths (/share/:id, /wikidata+gptkb, /_app/...):
    #     ProxyPass /test/v2/ http://grasp-container/
    # The app is served only at the mount root, so its relative asset paths
    # (./_app/...) resolve correctly at any prefix depth with no <base> needed.
    # The /share/:id redirect below uses a relative "../" target so it, too, lands
    # on the mount root under any prefix. If the prefix were passed through instead,
    # the ^-anchored location regexes below would miss and 404.
    #
    # Use relative redirects so they work behind a reverse proxy with a path prefix.
    absolute_redirect off;

    # Static assets (checked first due to regex priority).
    location ~* \.(?:ico|gif|jpe?g|png|svg|webp|woff2?|ttf|eot|otf|js|css|map|json)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /share/:id → 302 to the query-param form (/?share=:id) so the app is served
    # at the mount root. Required for Safari/WebKit: it ignores an injected <base>
    # for dynamically imported modules, so serving the app one level deep at
    # /share/:id made its own _app/*.js resolve to /share/_app/... → 404, and the
    # app never booted. The relative "../" keeps the target on the mount root under
    # any path prefix. The app reads ?share=:id (ChatApp.readQueryParams).
    location ~ ^/share/(.+?)/?$ {
        return 302 "../?share=$1";
    }

    # Single path segment without dots (KG names like /wikidata+gptkb+freebase,
    # optionally with one task id mixed in, e.g. /wikidata+sparql-qa or /cea)
    # → serve index.html; the Svelte app reads KG names and the task from the path.
    # Inject a meta tag so the app knows this is a KG path (not the mount point).
    location ~ ^/[^/.]+/?$ {
        sub_filter '</head>' '<meta name="grasp-kg-path" content="true"></head>';
        sub_filter_once on;
        sub_filter_types text/html;
        try_files /index.html =404;
    }

    # Root and static files.
    location / {
        try_files $uri $uri/ =404;
    }
}
